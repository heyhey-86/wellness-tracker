let S={periods:[],view:'today',pin:null};

async function loadFromDB(){
  const {data}=await db.from('wellness_periods').select('period_date').eq('user_pin',S.pin).order('period_date',{ascending:false});
  if(data) S.periods=data.map(r=>r.period_date);
}

async function addP(inputId){
  const v=document.getElementById(inputId)?.value;
  if(!v){alert('Please select a date.');return}
  if(S.periods.includes(v))return;
  const{error}=await db.from('wellness_periods').insert({user_pin:S.pin,period_date:v});
  if(!error){S.periods.push(v);render();}
  else alert('Could not save. Please try again.');
}

async function delP(d){
  if(!confirm('Remove '+fmt(d)+'?'))return;
  const{error}=await db.from('wellness_periods').delete().eq('user_pin',S.pin).eq('period_date',d);
  if(!error){S.periods=S.periods.filter(p=>p!==d);render();}
}

async function setPin(isNew){
  const input=document.getElementById('pinInput');
  const pin=input?.value?.trim();
  if(!pin||pin.length<4){document.getElementById('pinErr').textContent='Please enter a 4-digit PIN';return;}
  if(isNew){
    const confirm2=document.getElementById('pinConfirm')?.value?.trim();
    if(pin!==confirm2){document.getElementById('pinErr').textContent='PINs do not match';return;}
  }
  S.pin=pin;
  localStorage.setItem('wt_pin',pin);

}

function avgCycle(){
  if(S.periods.length<2)return null;
  const asc=[...S.periods].sort((a,b)=>new Date(a)-new Date(b));
  const gaps=[];
  for(let i=1;i<asc.length;i++){const d=(new Date(asc[i])-new Date(asc[i-1]))/86400000;if(d>15&&d<65)gaps.push(d)}
  return gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null
}

function phaseInfo(){
  if(!S.periods.length)return null;
  const sorted=[...S.periods].sort((a,b)=>new Date(b)-new Date(a));
  const last=sorted[0];
  const today=new Date();today.setHours(0,0,0,0);
  const lp=new Date(last);lp.setHours(0,0,0,0);
  const raw=Math.floor((today-lp)/86400000)+1;
  const cl=avgCycle()||28;
  const day=((raw-1)%cl)+1;
  const lutLen=12,ovLen=4,menLen=5;
  const folLen=cl-menLen-ovLen-lutLen;
  const folEnd=menLen+Math.max(folLen,1);
  const ovEnd=folEnd+ovLen;
  let phase='menstrual',phaseEnd=menLen;
  if(day>menLen&&day<=folEnd){phase='follicular';phaseEnd=folEnd}
  else if(day>folEnd&&day<=ovEnd){phase='ovulatory';phaseEnd=ovEnd}
  else if(day>ovEnd){phase='luteal';phaseEnd=cl}
  const segDays=[menLen,Math.max(folLen,1),ovLen,lutLen];
  return{phase,day,cl,daysUntilPeriod:cl-day+1,daysLeftInPhase:phaseEnd-day+1,segDays}
}

  const bnav=document.getElementById('bnav');
  document.getElementById('hdrS').textContent=todayFmt();

  if(!S.pin){
    bnav.style.display='none';
    main.innerHTML=`
      <div class="welcome">
        <div style="font-size:52px;margin-bottom:14px">🌸</div>
        <h2>My Wellness Tracker</h2>
        <p>Create a 4-digit PIN to protect your data. Your PIN means your period dates are saved permanently — they will never be lost even if you clear your browser.</p>
      </div>
      <div class="card">
        <div class="ctitle">Create your PIN</div>
        <p style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px">Choose any 4-digit number you will remember.</p>
        <div class="pin-box"><input type="password" id="pinInput" maxlength="6" placeholder="PIN" inputmode="numeric"></div>
        <div class="pin-box" style="margin-top:8px"><input type="password" id="pinConfirm" maxlength="6" placeholder="Confirm PIN" inputmode="numeric"></div>
        <div class="err" id="pinErr"></div>
        <div style="margin-top:12px"><button class="btn-p" onclick="setPin(true)">Create PIN & Start</button></div>
      </div>
      <div class="card">
        <div class="ctitle">Already have a PIN?</div>
        <p style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px">If you have used this app before, enter your existing PIN to restore all your data.</p>
        <div class="pin-box"><input type="password" id="restorePin" maxlength="6" placeholder="Your PIN" inputmode="numeric"></div>
        <div class="err" id="restoreErr"></div>
        <div style="margin-top:12px"><button class="btn-sec" onclick="restorePin()">Restore my data</button></div>
      </div>`;
    return;
  }

  const info=phaseInfo();
  const avg=avgCycle();

  if(!info){
    bnav.style.display='none';
    main.innerHTML=`
      <div class="welcome">
        <div style="font-size:52px;margin-bottom:14px">🌸</div>
        <h2>My Wellness Tracker</h2>
        <p>Log the start of each period as it happens. The app learns your real cycle length and guides you through every phase.</p>
      </div>
      <div class="card">
        <div class="ctitle">When did your last period start?</div>
        <p style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px">Enter the <strong>first day of actual red bleeding</strong> — not spotting.</p>
        <div class="add-row"><input type="date" id="fd" max="${td()}"><button class="btn-p" onclick="addP('fd')">Begin</button></div>
      </div>`;
    return;
  }

  bnav.style.display='flex';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+S.view);
  if(nb)nb.classList.add('on');

  const ph=PH[info.phase];
  const{segDays}=info;

  const cbar=SEGS.map((s,i)=>`<div style="flex:${segDays[i]}"><div class="cseg" style="background:${s.c};opacity:${s.key===info.phase?1:0.2}"></div><div class="clbl">${s.label}</div></div>`).join('');

  let trans='';
  if(info.daysLeftInPhase<=2){
    const np=PH[info.phase].next;
    const nbg=np==='Follicular'?'var(--fbg)':np==='Ovulatory'?'var(--obg)':np==='Luteal'?'var(--lbg)':'var(--mbg)';
    const nc=np==='Follicular'?'var(--fdk)':np==='Ovulatory'?'var(--odk)':np==='Luteal'?'var(--ldk)':'var(--mdk)';
    trans=`<div class="trans" style="background:${nbg};color:${nc}"><span style="font-size:16px">→</span><span><strong>${np} Phase begins ${info.daysLeftInPhase===1?'tomorrow':'in 2 days'}</strong> — your guidance updates automatically</span></div>`
  }

  const hero=`
    <div class="hero" style="background:${ph.bg};color:${ph.dk}">
      <div class="hero-lbl">${ph.name}</div>
      <div class="hero-name">${ph.tagline}</div>
      <div class="hero-desc">${ph.desc}</div>
      <div class="hstats">
        <div class="hs"><div class="hs-v">${info.day}</div><div class="hs-l">Day of cycle</div></div>
        <div class="hs"><div class="hs-v">${info.daysUntilPeriod}d</div><div class="hs-l">Until next period</div></div>
        <div class="hs"><div class="hs-v">${avg?avg+'d':'~28d'}</div><div class="hs-l">Avg cycle${avg?'':' (default)'}</div></div>
      </div>
    </div>
    ${trans}
    <div class="cbar-w">
      <div class="cbar-t">Your cycle — where you are now</div>
      <div class="cbar">${cbar}</div>
      <div class="clbls">${SEGS.map((s,i)=>`<div class="clbl" style="flex:${segDays[i]}">${s.label}</div>`).join('')}</div>
      <div class="cbar-info">Day ${info.day} of an estimated ${info.cl}-day cycle</div>
    </div>`;

  let body='';

  if(S.view==='today'){
    body=`
      <div class="ov3">
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">🥗</div><div><div class="ov-l" style="color:${ph.dk}">Eat</div><div class="ov-t" style="color:${ph.dk}">${ph.nut[0]}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">💪</div><div><div class="ov-l" style="color:${ph.dk}">Move</div><div class="ov-t" style="color:${ph.dk}">${ph.exBest[0].t}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">🌙</div><div><div class="ov-l" style="color:${ph.dk}">Tonight</div><div class="ov-t" style="color:${ph.dk}">${ph.sleep[0]}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">⚡</div><div><div class="ov-l" style="color:${ph.dk}">Supplements</div><div class="ov-t" style="color:${ph.dk}">Creatine 3–5g · D3-K2 with breakfast · Omega-3 with a meal · Magnesium before bed</div></div></div>
      </div>
      <div class="tip" style="background:${ph.bg};border-color:${ph.c}"><div class="tip-l" style="color:${ph.dk}">Phase tip</div><div class="tip-t" style="color:${ph.dk}">${ph.exTip}</div></div>
      <div class="card" style="border-color:var(--llt);background:var(--lbg)">
        <div class="ctitle" style="color:var(--ldk)">At 40 — worth knowing</div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Perimenopause often begins in the early-to-mid 40s — irregular cycles are one of the early signs. This app is built with exactly this life stage in mind.</div></div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Protein, resistance training and sleep quality become more important as hormones shift — not less.</div></div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Your existing activities — Zumba, yoga, swimming, cycling — are an excellent foundation. Adding weights and occasional HIIT completes the picture.</div></div>
      </div>
      ${!avg?`<div class="notice n-amber">Log one more period date to replace the 28-day default with your real cycle length.</div>`:''}`;
  }

  if(S.view==='exercise'){
    const avoidHtml=ph.exCaution.length?`<div class="card"><div class="ctitle" style="color:var(--m)">Ease off this phase</div>${ph.exCaution.map(c=>`<div class="avoid-item"><span style="color:var(--m);font-weight:700;flex-shrink:0">–</span><span>${c}</span></div>`).join('')}</div>`:'';
    const weightsHtml=ph.showWeightsWhy?`<div class="card" style="border-color:var(--flt)"><div class="ctitle">Why resistance training matters at 40 <span class="ev ev-s">Strong evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Bone density:</strong> Most effective intervention for preventing osteoporosis — more so than calcium supplements or moderate cardio alone.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Metabolism:</strong> Muscle mass declines from around 35 without resistance work — the primary driver of slowing metabolism with age.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Hormones:</strong> Heavy lifting stimulates growth hormone and testosterone — the hormones beginning to decline in your 40s.</div></div></div>`:'';
    const saunaHtml=ph.showSauna?`<div class="card" style="border-color:${ph.lt}"><div class="ctitle">Heat therapy — if you have access <span class="ev ev-e">Emerging evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">20 minutes in a sauna after exercise has shown early promise for women: improved insulin response, body composition and muscle metabolism.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">Heat therapy appears more beneficial for women than cold water immersion for hormonal health specifically.</div></div></div>`:'';
    body=`
      <div class="card"><div class="ctitle">Best activities right now</div><p style="font-size:13px;color:var(--mut);margin-bottom:12px;line-height:1.5">${ph.exSummary}</p>${ph.exBest.map(e=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${e.t}${e.add?'<span class="ev ev-g" style="margin-left:6px">Try adding this</span>':''}</div></div>`).join('')}</div>
      ${avoidHtml}
      <div class="tip" style="background:${ph.bg};border-color:${ph.c}"><div class="tip-l" style="color:${ph.dk}">Phase tip</div><div class="tip-t" style="color:${ph.dk}">${ph.exTip}</div></div>
      <div class="notice n-purple" style="font-size:12px"><strong>Evidence note:</strong> ${ph.exEv}</div>
      ${weightsHtml}${saunaHtml}
      <div class="card" style="border-color:${ph.lt}"><div class="ctitle">Your existing activities — keep all of them <span class="ev ev-s">Strong evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Swimming, cycling, walking, Zumba, yoga</strong> all have strong independent evidence. They work alongside HIIT and weights — not instead of them.</div></div></div>`;
  }

  if(S.view==='nutrition'){
    body=`
      <div class="card"><div class="ctitle">Nutrition this phase <span class="ev ev-s">GF · Dairy-free</span></div>${ph.nut.map(n=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${n}</div></div>`).join('')}</div>
      <div class="notice n-purple" style="font-size:12px"><strong>Evidence note:</strong> ${ph.nutEv}</div>
      <div class="card" style="border-color:${ph.lt}"><div class="ctitle">Protein — most important at 40 <span class="ev ev-s">Strong evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Daily target:</strong> 1.6–2.0g per kg of body weight.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>After training:</strong> 35g within 45 minutes — eggs, tinned salmon, chicken, tofu, dairy-free protein shake</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Why more at 40:</strong> Muscle becomes less responsive to the protein signal after 40. You need more, not less.</div></div></div>
      <div class="card"><div class="ctitle">Daily supplements <span class="ev ev-s">Evidence-based</span></div>${SUPPS.map(s=>`<div class="supp-item"><div class="s-ico">${s.ico}</div><div><div class="s-name">${s.name} <span class="ev ${s.ev==='s'?'ev-s':s.ev==='g'?'ev-g':'ev-e'}">${s.evLabel}</span></div><div class="s-dose">${s.dose}</div><div class="s-why">${s.why}</div></div></div>`).join('')}</div>`;
  }

  if(S.view==='sleep'){
    body=`
      <div class="card"><div class="ctitle">Sleep — ${ph.name}</div>${ph.sleep.map(s=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${s}</div></div>`).join('')}</div>
      <div class="card"><div class="ctitle">Always helpful — every phase <span class="ev ev-s">Strong evidence</span></div>${['Dark room — blackout curtains make a measurable difference','Cool temperature around 18°C','No screens 1 hour before bed — blue light directly suppresses melatonin','Consistent wake time even on weekends','Magnesium glycinate (200–400mg) before bed','Tart cherry juice in the evening — natural melatonin'].map(s=>`<div class="ai"><div class="adot" style="background:var(--bdr2)"></div><div class="at" style="color:var(--mut)">${s}</div></div>`).join('')}</div>
      <div class="card"><div class="ctitle">For difficult nights</div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Yoga Nidra / NSDR:</strong> 10–20 min guided body scan on YouTube — provides real rest even without sleep.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>4-7-8 breathing:</strong> Inhale 4, hold 7, exhale 8. Repeat 4 times. Reduces cortisol fast.</div></div></div>`;
  }

  if(S.view==='log'){
    const sorted=[...S.periods].sort((a,b)=>new Date(b)-new Date(a));
    const asc=[...S.periods].sort((a,b)=>new Date(a)-new Date(b));
    const gaps=[];
    for(let i=1;i<asc.length;i++){const d=Math.round((new Date(asc[i])-new Date(asc[i-1]))/86400000);if(d>15&&d<65)gaps.push({from:fmtS(asc[i-1]),to:fmtS(asc[i]),days:d})}
    const av=avgCycle();const n=S.periods.length;
    const cc=n>=5?'var(--f)':n>=3?'var(--o)':'var(--m)';
    const ct=n>=5?'High accuracy':n>=3?'Building accuracy':'Low — add more dates';
    body=`
      <div class="notice n-green">Log the <strong>first day of actual red bleeding</strong> — not spotting.</div>
      <div class="card"><div class="ctitle">Add a period</div><div class="add-row"><input type="date" id="nd" max="${td()}"><button class="btn-p" onclick="addP('nd')">Add</button></div></div>
      ${sorted.length?`<div class="card"><div class="ctitle">Period history</div>${sorted.map((d,i)=>`<div class="pr"><span>${fmt(d)}${i===0?'<span class="tag-l">Latest</span>':''}</span><button class="del" onclick="delP('${d}')">×</button></div>`).join('')}</div>`:''}
      ${gaps.length?`<div class="card"><div class="ctitle">Your cycle lengths <span class="ev" style="background:${cc}18;color:${cc}">${ct}</span></div>${gaps.map(g=>`<div class="clen"><span style="color:var(--mut);font-size:12px">${g.from} to ${g.to}</span><span style="font-weight:700">${g.days}d</span></div>`).join('')}${av?`<div style="margin-top:11px;padding:9px 13px;background:var(--bg);border-radius:var(--rs);display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--mut)">Your average cycle</span><span style="font-size:18px;font-weight:700">${av} days</span></div>`:''}</div>`:''}
      <div class="card"><div class="ctitle" style="color:var(--fnt)">Your PIN</div><p style="font-size:13px;color:var(--mut);line-height:1.6">Your PIN is <strong>${S.pin}</strong>. Keep this safe — you will need it if you change device or clear your browser. Your data is saved permanently in the cloud.</p></div>`;
  }

  main.innerHTML=hero+body;
}

async function init(){
  const pin=localStorage.getItem('wt_pin');
  if(pin){
    S.pin=pin;
    await loadFromDB();
  }
  render();
}

init();
</script>
</body>
</html>
