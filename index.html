<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wellness">
<meta name="theme-color" content="#FAF8F5">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>My Wellness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF8F5;--sur:#FFF;--bdr:#EDE9E4;--bdr2:#D5CFC7;
  --txt:#2C2420;--mut:#7A706A;--fnt:#B0A8A2;
  --m:#C4756A;--mbg:#FDF1EF;--mlt:#F5D5D0;--mdk:#6B3530;
  --f:#5A8A6E;--fbg:#EFF7F2;--flt:#C8E4D4;--fdk:#2A5040;
  --o:#C09040;--obg:#FDF8EE;--olt:#F0DFB0;--odk:#6B4E10;
  --l:#7068A8;--lbg:#F4F2FA;--llt:#D0CCE8;--ldk:#3C3460;
  --r:16px;--rs:10px
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:16px 18px 12px;position:sticky;top:0;z-index:100}
.hdr-t{font-family:'Playfair Display',serif;font-size:20px;font-weight:400}
.hdr-s{font-size:12px;color:var(--mut);margin-top:2px}
.main{padding:14px;max-width:480px;margin:0 auto}
.hero{border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.hero-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;margin-bottom:5px;line-height:1.2}
.hero-desc{font-size:13px;opacity:.82;line-height:1.55;margin-bottom:14px}
.hstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.hs{background:rgba(255,255,255,.52);border-radius:9px;padding:9px 8px;text-align:center}
.hs-v{font-size:19px;font-weight:700;line-height:1}
.hs-l{font-size:10px;opacity:.7;margin-top:3px;line-height:1.3}
.trans{border-radius:var(--rs);padding:9px 13px;margin-bottom:12px;font-size:13px;line-height:1.5;display:flex;gap:9px;align-items:center}
.cbar-w{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 14px;margin-bottom:12px}
.cbar-t{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.cbar{display:flex;gap:3px;margin-bottom:5px}
.cseg{height:9px;border-radius:5px}
.clbls{display:flex;gap:3px}
.clbl{font-size:10px;color:var(--fnt);text-align:center;line-height:1.3}
.cbar-info{font-size:12px;color:var(--mut);margin-top:6px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:10px}
.ctitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.ai{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.ai:last-child{margin-bottom:0}
.adot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.at{font-size:14px;line-height:1.55}
.at strong{font-weight:600}
.avoid-item{display:flex;gap:8px;font-size:13px;color:var(--mut);line-height:1.5;padding:3px 0}
.tip{border-radius:var(--r);padding:15px 16px;margin-bottom:10px;border-left:4px solid}
.tip-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-bottom:6px}
.tip-t{font-size:14px;line-height:1.55}
.ev{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:5px;vertical-align:middle}
.ev-s{background:#EFF7F2;color:#2A5040}
.ev-g{background:#FDF8EE;color:#6B4E10}
.ev-e{background:#F4F2FA;color:#3C3460}
.ov3{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.ovc{border-radius:var(--rs);padding:12px 14px;display:flex;gap:11px;align-items:flex-start}
.ov-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ov-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.65;margin-bottom:3px}
.ov-t{font-size:13px;line-height:1.45}
.supp-item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bdr)}
.supp-item:last-child{border-bottom:none;padding-bottom:0}
.supp-item:first-child{padding-top:0}
.s-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--bg)}
.s-name{font-size:13px;font-weight:600;margin-bottom:2px}
.s-dose{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.s-why{font-size:12px;color:var(--mut);line-height:1.45}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
input[type=date]{font-family:'Nunito',sans-serif;font-size:14px;padding:9px 11px;border-radius:var(--rs);border:1px solid var(--bdr2);background:var(--bg);color:var(--txt);outline:none;flex:1;min-width:0}
.btn-p{padding:9px 18px;border-radius:var(--rs);border:none;background:var(--txt);color:#fff;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.pr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:14px}
.pr:last-child{border-bottom:none}
.del{background:none;border:none;color:var(--fnt);cursor:pointer;font-size:20px;line-height:1;padding:0 2px}
.tag-l{display:inline-block;font-size:10px;font-weight:700;background:var(--mbg);color:var(--m);padding:2px 8px;border-radius:7px;margin-left:6px}
.clen{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.clen:last-child{border-bottom:none}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bdr);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--fnt);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.nb.on{color:var(--txt)}
.nb-ic{font-size:19px}
.notice{border-radius:var(--rs);padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:10px}
.n-amber{background:var(--obg);border:1px solid var(--olt);color:var(--odk)}
.n-green{background:var(--fbg);border:1px solid var(--flt);color:var(--fdk)}
.n-purple{background:var(--lbg);border:1px solid var(--llt);color:var(--ldk)}
.welcome{text-align:center;padding:32px 16px 16px}
.welcome h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;margin-bottom:10px}
.welcome p{font-size:14px;color:var(--mut);line-height:1.7;margin:0 auto 20px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-t">My Wellness Tracker</div>
  <div class="hdr-s" id="hdrS">Your personal guide by cycle phase</div>
</div>
<div class="main" id="main"><div style="padding:2rem;text-align:center;color:var(--mut)">Loading...</div></div>
<nav class="bnav" id="bnav" style="display:none">
  <button class="nb on" id="nb-today" onclick="go('today')"><span class="nb-ic">✦</span>Today</button>
  <button class="nb" id="nb-exercise" onclick="go('exercise')"><span class="nb-ic">💪</span>Exercise</button>
  <button class="nb" id="nb-nutrition" onclick="go('nutrition')"><span class="nb-ic">🥗</span>Nutrition</button>
  <button class="nb" id="nb-sleep" onclick="go('sleep')"><span class="nb-ic">🌙</span>Sleep</button>
  <button class="nb" id="nb-log" onclick="go('log')"><span class="nb-ic">📅</span>Log</button>
</nav>
<script>
const PH={
  menstrual:{key:'menstrual',name:'Period Phase',next:'Follicular',c:'#C4756A',bg:'#FDF1EF',lt:'#F5D5D0',dk:'#6B3530',
    desc:'Your uterine lining sheds and oestrogen and progesterone are at their lowest. Energy drops — this is biology, not weakness.',
    tagline:'Rest and restore — your body is working hard',
    nutEv:'Phase-specific nutrition has biological logic but limited clinical trial evidence. These are sensible tendencies to explore, not strict rules to follow.',
    nut:['Iron-rich foods to replenish losses: dark leafy greens, lentils, eggs, pumpkin seeds','Anti-inflammatory foods genuinely help cramps and fatigue: ginger tea, turmeric, berries, oily fish','Magnesium-rich foods ease cramping: almonds, cashews, spinach, dairy-free dark chocolate (70%+)','Warm cooked meals tend to feel better than cold raw food — soups, roasted veg, rice dishes','Hydrate consistently and consider electrolytes if cramps or fatigue are severe'],
    exSummary:'Reduce intensity this week. Gentle movement is productive — pushing hard offers less return and higher cost during menstruation.',
    exEv:'Good evidence that perceived effort and cortisol are both elevated during menstruation. Rest or gentle movement is the better choice for most women.',
    exBest:[{t:'Yoga or yin yoga — well supported for pain and mood during menstruation',add:false},{t:'Easy swimming in warm water — relieves cramps and is restorative',add:false},{t:'Walking — low impact, mood-supportive, effective for cortisol management',add:false},{t:'Gentle stretching and breathwork at home',add:false}],
    exCaution:['Heavy resistance training and HIIT — save these for next week when your body responds significantly better','Pushing through real exhaustion — cortisol is already higher during menstruation, adding training stress compounds this'],
    exTip:'This is the one week where rest genuinely outperforms training. Your strength and capacity will return fully in the follicular phase — use this week to recover properly.',
    showWeightsWhy:false,showSauna:false,
    sleep:['You will likely want more sleep than usual — this is biological, not laziness. Honour it.','Magnesium glycinate before bed helps significantly with cramp-related sleep disruption','A warm water bottle on your lower back eases cramping and helps you fall asleep more easily','Avoid alcohol this week — it worsens cramps and fragments the deep sleep stages you need most','Keep your room cool around 18°C — your body temperature is slightly elevated during menstruation']},

  follicular:{key:'follicular',name:'Follicular Phase',next:'Ovulatory',c:'#5A8A6E',bg:'#EFF7F2',lt:'#C8E4D4',dk:'#2A5040',
    desc:'Oestrogen rises steadily as follicles develop. Energy, mood and physical capacity all improve noticeably. Generally your best training window of the month.',
    tagline:'Energy rising — lean into your favourite activities',
    nutEv:'Eating more carbs in the first half of the cycle has biological support but limited clinical evidence. These are useful tendencies to explore, not rules to enforce.',
    nut:['Your body handles carbohydrates well right now: brown rice, quinoa, sweet potato, gluten-free pasta, certified GF oats','Fermented foods support gut health and oestrogen processing: coconut yogurt, kimchi, sauerkraut, kombucha','Lean protein at every meal: eggs, fish, chicken, tofu, lentils, chickpeas','Fresh lighter foods suit this phase well — rice salads, smoothie bowls, avocado, fresh fruit','Pre-workout: banana with almond butter, or dates with a boiled egg — 30 minutes before class'],
    exSummary:'Your body responds well to harder training right now. A good time to add or increase resistance work and HIIT alongside your existing activities.',
    exEv:'Strong evidence that resistance training and HIIT benefit women at 40 for bone density, metabolism and hormonal health. Timing to the follicular phase may offer additional benefit — evidence on phase-specific timing is still developing.',
    exBest:[{t:'Resistance training — the most important addition to your routine at 40. Aim for 2 sessions per week',add:true},{t:'HIIT — 30 seconds effort, 2 minutes full rest, 6–8 rounds. 25 minutes total is enough',add:true},{t:'Zumba and Zumba toning — great classes to attend at full energy this week',add:false},{t:'Spin class with more resistance on the intervals',add:false},{t:'Longer or hillier e-bike rides in the mountains',add:false},{t:'Swimming with more laps or slightly faster intervals',add:false}],
    exCaution:[],
    exTip:'Your existing activities are excellent and should be kept. Adding resistance training twice a week is the single most impactful change you can make at 40 — for bone density, metabolism and hormonal health.',
    showWeightsWhy:true,showSauna:true,
    sleep:['Sleep quality is generally good in this phase — recover well and use it to build consistent habits','Aim for 7–9 hours — your body rebuilds muscle and bone during sleep, especially after resistance training','Morning light within 30 minutes of waking helps regulate energy and mood all day','Use this good sleep window to strengthen habits that protect you in the harder phases ahead']},

  ovulatory:{key:'ovulatory',name:'Ovulatory Phase',next:'Luteal',c:'#C09040',bg:'#FDF8EE',lt:'#F0DFB0',dk:'#6B4E10',
    desc:'Oestrogen peaks and the egg is released. Physical and cognitive performance are typically at their monthly highest. Strength, coordination and pain tolerance are all elevated.',
    tagline:'Peak energy — your strongest days of the month',
    nutEv:'Eating generously around ovulation is biologically sensible — your metabolism is at its monthly high. Clinical evidence on precise phase nutrition is limited, so treat this as useful guidance rather than precision protocol.',
    nut:['Fuel generously — your metabolism is at its monthly highest right now','Cruciferous vegetables support oestrogen processing: broccoli, cauliflower, kale, cabbage','Quality protein at every meal — eggs, oily fish, chicken, tofu, lentils','Do not undereat or skip meals this week — energy demands are at their peak','Post-workout: aim for 35g protein within 45 minutes — eggs, tinned salmon, chicken, dairy-free shake'],
    exSummary:'Peak physical window. The right time for your hardest sessions, heaviest lifts and longest efforts.',
    exEv:'Good evidence that women have peak strength, coordination and pain tolerance around ovulation. The performance difference is real, though individual variation is significant.',
    exBest:[{t:'Heavy resistance training — attempt your most challenging lifts of the month this week',add:true},{t:'HIIT at maximum effort — cardiovascular and muscular capacity are both at their monthly high',add:true},{t:'High-energy Zumba — coordination is at its sharpest, complex routines feel easier',add:false},{t:'Challenging spin class — push the harder intervals',add:false},{t:'Long hilly e-bike rides into the mountains — best phase for big outdoor efforts',add:false},{t:'Longest swim or fastest pace of the month',add:false}],
    exCaution:[],
    exTip:'This is your best week to attempt things that feel hard — heavier weights, longer routes, faster intervals. Coordination is sharper, pain tolerance higher and recovery is fastest. Use it.',
    showWeightsWhy:false,showSauna:true,
    sleep:['You may feel you need slightly less sleep and still feel great — normal around ovulation','A small drop in oestrogen just after ovulation can cause one restless night — temporary and common','Keep your room cool around 18°C even when energy is high','Maintain the no-screens habit before bed even in high-energy phases — it protects luteal sleep quality']},

  luteal:{key:'luteal',name:'Luteal Phase',next:'Period',c:'#7068A8',bg:'#F4F2FA',lt:'#D0CCE8',dk:'#3C3460',
    desc:'Progesterone rises after ovulation then falls. Energy, mood and sleep quality tend to decline in the second half. This is hormonal — not a reflection of fitness or character.',
    tagline:'Wind down gently — support your body this week',
    nutEv:'Progesterone increases calorie burn slightly and affects mood and cravings. These suggestions are well-reasoned but clinical evidence on phase-specific eating remains limited. Your body signals are often the most reliable guide.',
    nut:['Prioritise protein to protect muscle — your body is more prone to muscle breakdown in the luteal phase','Complex gluten-free carbs stabilise mood and energy: certified GF oats, sweet potato, brown rice, quinoa','Reduce caffeine especially in the second half — it noticeably worsens anxiety, mood and sleep quality','Calcium-rich dairy-free foods ease PMS symptoms: fortified almond milk, broccoli, kale, tinned salmon with bones','Dairy-free dark chocolate (70%+) is genuinely useful — magnesium content reduces cravings and mood dips'],
    exSummary:'Keep moving but reduce intensity. Training is still effective in the luteal phase — it just feels harder than it is. Manage expectations and avoid pushing to exhaustion.',
    exEv:'Perceived effort is measurably higher in the luteal phase due to elevated body temperature and faster glycogen depletion. Training is still beneficial — lighter work with higher reps is effective and appropriate.',
    exBest:[{t:'Yoga and restorative movement — well-suited to this phase, with good evidence for mood and cortisol benefits',add:false},{t:'Light to moderate resistance training — lower weight, higher reps (12–15). Still effective, still worth doing',add:true},{t:'Walking — one of the most effective mood and cortisol management tools this week',add:false},{t:'Your regular swimming, cycling and Zumba — keep going, just dial back the intensity slightly',add:false},{t:'Gentle e-bike rides on flatter routes — enjoyable movement without high physical cost',add:false}],
    exCaution:['Maximal HIIT or very heavy lifting — cortisol is already elevated and high training stress tends to backfire this week','Pushing to complete exhaustion — recovery is slower and fatigue carries forward into your period week'],
    exTip:'If training feels harder than usual, that is genuinely true — not a fitness problem. Your core temperature is higher, glycogen depletes faster and perceived effort increases. Lighter shorter sessions still build strength and provide all the mood benefits.',
    showWeightsWhy:false,showSauna:false,
    sleep:['Sleep is hardest in this phase — progesterone changes reduce melatonin production and disrupt sleep architecture','Magnesium glycinate (200–400mg) before bed is the most evidence-backed intervention for this specific disruption','Tart cherry juice provides natural melatonin — a small glass in the evening has good supporting evidence','Yoga Nidra or a body scan meditation when you wake in the night — far better than reaching for your phone','Dark room, 18°C, no screens 1 hour before bed — these matter more in this phase than any other','Poor sleep in the luteal phase is hormonal and temporary — stressing about it makes it significantly worse']}
};

const SEGS=[{key:'menstrual',label:'Period',base:5,c:'#C4756A'},{key:'follicular',label:'Follicular',base:8,c:'#5A8A6E'},{key:'ovulatory',label:'Ovulatory',base:4,c:'#C09040'},{key:'luteal',label:'Luteal',base:11,c:'#7068A8'}];

const SUPPS=[
  {ico:'⚡',name:'Creatine monohydrate',dose:'3–5g daily, any time',ev:'s',evLabel:'Strong evidence',why:'One of the most researched supplements. In women at 40+, it improves muscle strength, brain fog, cognitive function and mood — not just athletic performance. Mix into water or any drink.'},
  {ico:'☀️',name:'Vitamin D3 with K2',dose:'Morning, with food',ev:'s',evLabel:'Strong evidence',why:'D3 deficiency is common and linked to bone loss, low mood, immune dysfunction and fatigue. K2 directs calcium to bones rather than arteries. Essential given seasonal variation in sunlight exposure.'},
  {ico:'🐟',name:'Omega-3s (EPA + DHA)',dose:'1–2g daily with a meal',ev:'s',evLabel:'Strong evidence',why:'Fish oil or algae-based capsules. Reduces chronic inflammation, supports brain health and mood, and protects cardiovascular health. One of the most consistently supported supplements.'},
  {ico:'🌙',name:'Magnesium glycinate',dose:'200–400mg in the evening',ev:'g',evLabel:'Good evidence',why:'Most women are deficient. Improves sleep quality, reduces cramps and muscle soreness, and supports mood. Glycinate form is gentler on the stomach than magnesium citrate or oxide.'},
  {ico:'🩸',name:'Iron',dose:'Only if blood test confirms low',ev:'e',evLabel:'Get tested first',why:'Common in active women with a GF/DF diet and regular blood loss. Symptoms: fatigue, brain fog, cold hands, hair thinning. Supplementing unnecessarily causes harm — get an annual blood panel.'}
];

let S={periods:[],view:'today'};
function save(){try{localStorage.setItem('cwt6',JSON.stringify({periods:S.periods,view:S.view}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('cwt6')||'{}');S.periods=d.periods||[];S.view=d.view||'today'}catch(e){}}

function avgCycle(){
  if(S.periods.length<2)return null;
  const asc=[...S.periods].sort((a,b)=>new Date(a)-new Date(b));
  const gaps=[];
  for(let i=1;i<asc.length;i++){const d=(new Date(asc[i])-new Date(asc[i-1]))/86400000;if(d>15&&d<65)gaps.push(d)}
  return gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null
}

function phaseInfo(){
  if(!S.periods.length)return null;
  const last=[...S.periods].sort((a,b)=>new Date(b)-new Date(a))[0];
  const today=new Date();today.setHours(0,0,0,0);
  const lp=new Date(last);lp.setHours(0,0,0,0);
  const raw=Math.floor((today-lp)/86400000)+1;
  const cl=avgCycle()||28;
  const day=((raw-1)%cl)+1;
  const lutLen=12,ovLen=4,menLen=5;
  const folLen=cl-menLen-ovLen-lutLen;
  const folEnd=menLen+Math.max(folLen,1);
  const ovEnd=folEnd+ovLen;
  let phase='menstrual',phaseEnd=menLen;
  if(day>menLen&&day<=folEnd){phase='follicular';phaseEnd=folEnd}
  else if(day>folEnd&&day<=ovEnd){phase='ovulatory';phaseEnd=ovEnd}
  else if(day>ovEnd){phase='luteal';phaseEnd=cl}
  const segDays=[menLen,Math.max(folLen,1),ovLen,lutLen];
  return{phase,day,cl,daysUntilPeriod:cl-day+1,daysLeftInPhase:phaseEnd-day+1,segDays}
}

function td(){return new Date().toISOString().split('T')[0]}
function fmt(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtS(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function todayFmt(){return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

function go(v){S.view=v;save();render();window.scrollTo(0,0)}

function render(){
  const main=document.getElementById('main');
  const bnav=document.getElementById('bnav');
  document.getElementById('hdrS').textContent=todayFmt();
  if(!S.periods.length){bnav.style.display='none';renderWelcome(main);return}
  bnav.style.display='flex';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb-'+S.view);
  if(nb)nb.classList.add('on');
  const info=phaseInfo();
  const ph=PH[info.phase];
  const avg=avgCycle();
  const{segDays}=info;

  const cbar=SEGS.map((s,i)=>`<div style="flex:${segDays[i]}"><div class="cseg" style="background:${s.c};opacity:${s.key===info.phase?1:0.2}"></div><div class="clbl">${s.label}</div></div>`).join('');

  let trans='';
  if(info.daysLeftInPhase<=2){
    const np=PH[info.phase].next;
    const nbg=np==='Follicular'?'var(--fbg)':np==='Ovulatory'?'var(--obg)':np==='Luteal'?'var(--lbg)':'var(--mbg)';
    const nc=np==='Follicular'?'var(--fdk)':np==='Ovulatory'?'var(--odk)':np==='Luteal'?'var(--ldk)':'var(--mdk)';
    trans=`<div class="trans" style="background:${nbg};color:${nc}"><span style="font-size:16px">→</span><span><strong>${np} Phase begins ${info.daysLeftInPhase===1?'tomorrow':'in 2 days'}</strong> — your guidance updates automatically</span></div>`
  }

  const hero=`
    <div class="hero" style="background:${ph.bg};color:${ph.dk}">
      <div class="hero-lbl">${ph.name}</div>
      <div class="hero-name">${ph.tagline}</div>
      <div class="hero-desc">${ph.desc}</div>
      <div class="hstats">
        <div class="hs"><div class="hs-v">${info.day}</div><div class="hs-l">Day of cycle</div></div>
        <div class="hs"><div class="hs-v">${info.daysUntilPeriod}d</div><div class="hs-l">Until next period</div></div>
        <div class="hs"><div class="hs-v">${avg?avg+'d':'~28d'}</div><div class="hs-l">Avg cycle${avg?'':' (default)'}</div></div>
      </div>
    </div>
    ${trans}
    <div class="cbar-w">
      <div class="cbar-t">Your cycle — where you are now</div>
      <div class="cbar">${cbar}</div>
      <div class="clbls">${SEGS.map((s,i)=>`<div class="clbl" style="flex:${segDays[i]}">${s.label}</div>`).join('')}</div>
      <div class="cbar-info">Day ${info.day} of an estimated ${info.cl}-day cycle</div>
    </div>`;

  let body='';

  if(S.view==='today'){
    body=`
      <div class="ov3">
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">🥗</div><div><div class="ov-l" style="color:${ph.dk}">Eat</div><div class="ov-t" style="color:${ph.dk}">${ph.nut[0]}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">💪</div><div><div class="ov-l" style="color:${ph.dk}">Move</div><div class="ov-t" style="color:${ph.dk}">${ph.exBest[0].t}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">🌙</div><div><div class="ov-l" style="color:${ph.dk}">Tonight</div><div class="ov-t" style="color:${ph.dk}">${ph.sleep[0]}</div></div></div>
        <div class="ovc" style="background:${ph.bg}"><div class="ov-ico" style="background:${ph.lt}">⚡</div><div><div class="ov-l" style="color:${ph.dk}">Supplements</div><div class="ov-t" style="color:${ph.dk}">Creatine 3–5g · D3-K2 with breakfast · Omega-3 with a meal · Magnesium before bed</div></div></div>
      </div>
      <div class="tip" style="background:${ph.bg};border-color:${ph.c}"><div class="tip-l" style="color:${ph.dk}">Phase tip</div><div class="tip-t" style="color:${ph.dk}">${ph.exTip}</div></div>
      <div class="card" style="border-color:var(--llt);background:var(--lbg)">
        <div class="ctitle" style="color:var(--ldk)">At 40 — worth knowing</div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Perimenopause often begins in the early-to-mid 40s — irregular cycles are one of the early signs. This app is built with exactly this life stage in mind.</div></div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Protein, resistance training and sleep quality become more important as hormones shift — not less. Getting ahead of this now has a meaningful long-term impact.</div></div>
        <div class="ai"><div class="adot" style="background:var(--l)"></div><div class="at" style="color:var(--ldk)">Your existing activities — Zumba, yoga, swimming, cycling — are an excellent foundation. They are not the problem. Adding weights and occasional HIIT on top is what completes the picture.</div></div>
      </div>
      ${!avg?`<div class="notice n-amber">Log one more period date to replace the 28-day default with your real cycle length.</div>`:''}`;
  }

  if(S.view==='exercise'){
    const avoidHtml=ph.exCaution.length?`<div class="card"><div class="ctitle" style="color:var(--m)">Ease off this phase</div>${ph.exCaution.map(c=>`<div class="avoid-item"><span style="color:var(--m);font-weight:700;flex-shrink:0">–</span><span>${c}</span></div>`).join('')}</div>`:'';
    const weightsHtml=ph.showWeightsWhy?`<div class="card" style="border-color:var(--flt)"><div class="ctitle">Why resistance training matters at 40 <span class="ev ev-s">Strong evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Bone density:</strong> The most effective intervention for preventing osteoporosis — more so than calcium supplements or moderate cardio alone. Critical after 40.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Metabolism:</strong> Muscle mass declines from around 35 without resistance work. This is the primary driver of slowing metabolism with age — not ageing itself.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Hormones:</strong> Heavy lifting stimulates growth hormone and testosterone — the hormones beginning to decline in your 40s.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">Your existing activities are excellent and should be kept. Weights twice a week makes all of them more effective.</div></div></div>`:'';
    const saunaHtml=ph.showSauna?`<div class="card" style="border-color:${ph.lt}"><div class="ctitle">Heat therapy — if you have access <span class="ev ev-e">Emerging evidence</span></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">20 minutes in a sauna after exercise has shown early promise for women: improved insulin response, body composition and muscle metabolism. Evidence is promising but not yet definitive.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">Heat therapy appears more beneficial for women than cold water immersion. Ice baths, popular in general fitness, show less hormonal benefit for women specifically — though cold water does have other benefits.</div></div><div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">Not essential — but if you have sauna access, post-exercise sessions are worth trying in this phase.</div></div></div>`:'';
    body=`
      <div class="card">
        <div class="ctitle">Best activities right now</div>
        <p style="font-size:13px;color:var(--mut);margin-bottom:12px;line-height:1.5">${ph.exSummary}</p>
        ${ph.exBest.map(e=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${e.t}${e.add?'<span class="ev ev-g" style="margin-left:6px">Try adding this</span>':''}</div></div>`).join('')}
      </div>
      ${avoidHtml}
      <div class="tip" style="background:${ph.bg};border-color:${ph.c}"><div class="tip-l" style="color:${ph.dk}">Phase tip</div><div class="tip-t" style="color:${ph.dk}">${ph.exTip}</div></div>
      <div class="notice n-purple" style="font-size:12px"><strong>Evidence note:</strong> ${ph.exEv}</div>
      ${weightsHtml}
      ${saunaHtml}
      <div class="card" style="border-color:${ph.lt}">
        <div class="ctitle">Your existing activities — keep all of them <span class="ev ev-s">Strong evidence</span></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Swimming, cycling, walking, Zumba, yoga</strong> all have strong independent evidence for cardiovascular health, mental wellbeing, cortisol regulation and longevity. They are not inferior to HIIT and weights — they work alongside them.</div></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">The best overall approach is variety across intensities — some easy, some hard, some skill-based like Zumba, some strength-based. No single type of training covers everything.</div></div>
      </div>`;
  }

  if(S.view==='nutrition'){
    body=`
      <div class="card">
        <div class="ctitle">Nutrition this phase <span class="ev ev-s">GF · Dairy-free</span></div>
        ${ph.nut.map(n=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${n}</div></div>`).join('')}
      </div>
      <div class="notice n-purple" style="font-size:12px"><strong>Honest evidence note:</strong> ${ph.nutEv}</div>
      <div class="card" style="border-color:${ph.lt}">
        <div class="ctitle">Protein — most important at 40 <span class="ev ev-s">Strong evidence</span></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Daily target:</strong> 1.6–2.0g per kg of body weight. Mainstream sports science consensus — not specific to any one researcher.</div></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>After training:</strong> 35g within 45 minutes — eggs, tinned salmon, chicken, tofu, dairy-free protein shake</div></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Why more at 40:</strong> Muscle becomes less responsive to the protein signal after 40. You need more, not less, to achieve the same result as your 30s.</div></div>
      </div>
      <div class="card">
        <div class="ctitle">Daily supplements <span class="ev ev-s">Evidence-based</span></div>
        ${SUPPS.map(s=>`<div class="supp-item"><div class="s-ico">${s.ico}</div><div><div class="s-name">${s.name} <span class="ev ${s.ev==='s'?'ev-s':s.ev==='g'?'ev-g':'ev-e'}">${s.evLabel}</span></div><div class="s-dose">${s.dose}</div><div class="s-why">${s.why}</div></div></div>`).join('')}
      </div>`;
  }

  if(S.view==='sleep'){
    body=`
      <div class="card">
        <div class="ctitle">Sleep — ${ph.name} <span class="ev ev-s">Well documented</span></div>
        ${ph.sleep.map(s=>`<div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at">${s}</div></div>`).join('')}
      </div>
      <div class="card">
        <div class="ctitle">Always helpful — every phase <span class="ev ev-s">Strong evidence</span></div>
        ${['Dark room — blackout curtains make a measurable difference to sleep depth and duration','Cool temperature around 18°C — especially important in the luteal phase when body temperature rises','No screens 1 hour before bed — blue light directly suppresses melatonin. This is well-established.','Consistent wake time, even on weekends — the single most impactful sleep habit you can build','Magnesium glycinate (200–400mg) before bed — beneficial in any phase, not just luteal','Tart cherry juice in the evening — natural melatonin source with good evidence for improving sleep onset'].map(s=>`<div class="ai"><div class="adot" style="background:var(--bdr2)"></div><div class="at" style="color:var(--mut)">${s}</div></div>`).join('')}
      </div>
      <div class="card">
        <div class="ctitle">Tools for difficult nights</div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>NSDR / Yoga Nidra:</strong> A 10–20 minute guided body scan provides genuine physiological rest even without sleep. Search on YouTube — free and well-studied.</div></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>4-7-8 breathing:</strong> Inhale 4 counts, hold 7, exhale 8. Repeat four times. Activates the parasympathetic nervous system and reduces cortisol within minutes.</div></div>
        <div class="ai"><div class="adot" style="background:${ph.c}"></div><div class="at"><strong>Do not check the clock:</strong> Watching the time during a poor night increases cortisol and makes sleep harder. Phone face down before bed.</div></div>
      </div>`;
  }

  if(S.view==='log'){
    const sorted=[...S.periods].sort((a,b)=>new Date(b)-new Date(a));
    const asc=[...S.periods].sort((a,b)=>new Date(a)-new Date(b));
    const gaps=[];
    for(let i=1;i<asc.length;i++){const d=Math.round((new Date(asc[i])-new Date(asc[i-1]))/86400000);if(d>15&&d<65)gaps.push({from:fmtS(asc[i-1]),to:fmtS(asc[i]),days:d})}
    const av=avgCycle();
    const n=S.periods.length;
    const cc=n>=5?'var(--f)':n>=3?'var(--o)':'var(--m)';
    const ct=n>=5?'High accuracy':n>=3?'Building accuracy':'Low — add more dates';
    body=`
      <div class="notice n-green">Log the <strong>first day of actual red bleeding</strong> — not spotting. Add it as soon as your period starts each month. Phase guidance updates automatically.</div>
      <div class="card">
        <div class="ctitle">Add a period</div>
        <div class="add-row"><input type="date" id="nd" max="${td()}"><button class="btn-p" onclick="addP('nd')">Add</button></div>
      </div>
      ${sorted.length?`<div class="card"><div class="ctitle">Period history</div>${sorted.map((d,i)=>`<div class="pr"><span>${fmt(d)}${i===0?'<span class="tag-l">Latest</span>':''}</span><button class="del" onclick="delP('${d}')">x</button></div>`).join('')}</div>`:''}
      ${gaps.length?`<div class="card"><div class="ctitle">Your cycle lengths <span class="ev" style="background:${cc}18;color:${cc}">${ct}</span></div>${gaps.map(g=>`<div class="clen"><span style="color:var(--mut);font-size:12px">${g.from} to ${g.to}</span><span style="font-weight:700">${g.days}d</span></div>`).join('')}${av?`<div style="margin-top:11px;padding:9px 13px;background:var(--bg);border-radius:var(--rs);display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--mut)">Your average cycle</span><span style="font-size:18px;font-weight:700">${av} days</span></div>`:''}</div>`:''}
      <div class="card"><div class="ctitle" style="color:var(--fnt)">Note on contraception</div><p style="font-size:13px;color:var(--mut);line-height:1.6">If you use hormonal contraception (combined pill, hormonal IUD, implant or injection) your natural cycle is suppressed and phase guidance will not be accurate. Exercise, sleep and supplement advice remains fully relevant regardless.</p></div>`;
  }

  main.innerHTML=hero+body;
}

function renderWelcome(main){
  main.innerHTML=`
    <div class="welcome">
      <div style="font-size:52px;margin-bottom:14px">🌸</div>
      <h2>Your personal wellness tracker</h2>
      <p>Log the start of each period as it happens and the app guides you through every phase — exercise, nutrition, sleep and supplements — based on where you are in your cycle.</p>
    </div>
    <div class="card">
      <div class="ctitle">When did your last period start?</div>
      <p style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:12px">Enter the <strong>first day of actual red bleeding</strong> — not spotting. Your best estimate is fine to start.</p>
      <div class="add-row"><input type="date" id="fd" max="${td()}"><button class="btn-p" onclick="addP('fd')">Begin</button></div>
    </div>
    <div class="notice n-amber">Full guidance from your very first entry. The more period dates you log over time, the more accurately the app learns your personal cycle. Irregular cycles are handled automatically.</div>
    <div class="card">
      <div class="ctitle">Save to your phone home screen</div>
      <div class="ai"><div class="adot" style="background:var(--f)"></div><div class="at" style="color:var(--mut)"><strong>iPhone (Safari):</strong> Tap the Share button, then "Add to Home Screen"</div></div>
      <div class="ai"><div class="adot" style="background:var(--f)"></div><div class="at" style="color:var(--mut)"><strong>Android (Chrome):</strong> Tap the three-dot menu, then "Add to Home Screen"</div></div>
      <div class="ai"><div class="adot" style="background:var(--f)"></div><div class="at" style="color:var(--mut)">All data stays private on your device — nothing is sent anywhere</div></div>
    </div>`;
}

function addP(id){const v=document.getElementById(id)?.value;if(!v){alert('Please select a date.');return}if(!S.periods.includes(v)){S.periods.push(v);save()}render()}
function delP(d){if(!confirm('Remove '+fmt(d)+'?'))return;S.periods=S.periods.filter(p=>p!==d);save();render()}

load();render();
</script>
</body>
</html>
